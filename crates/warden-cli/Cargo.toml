[package]
name = "warden-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The warden command line: classify, run, undo, audit verify, prune"

[[bin]]
name = "warden"
path = "src/main.rs"

[dependencies]
warden-core = { path = "../warden-core" }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
serde_json = "1"
