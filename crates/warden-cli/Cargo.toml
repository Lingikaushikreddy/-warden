[package]
name = "warden-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The warden command line: classify, run, undo, audit verify, prune"

[[bin]]
name = "warden"
path = "src/main.rs"

[features]
# Test-only fault injection (WARDEN_TEST_FAIL_AUDIT_APPEND). Off by default;
# never enable it in a build that is shipped.
test-hooks = []

[[test]]
name = "test_hooks"
required-features = ["test-hooks"]

[dependencies]
warden-core = { path = "../warden-core" }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
# Self-reference so `cargo test` builds the binary with `test-hooks` on and
# the `test_hooks` target runs without extra flags.
warden-cli = { path = ".", features = ["test-hooks"] }
assert_cmd = "2"
tempfile = "3"
serde_json = "1"
