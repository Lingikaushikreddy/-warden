[package]
name = "warden-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The warden command line: classify, run, undo, audit verify, prune, agent"

[[bin]]
name = "warden"
path = "src/main.rs"

[features]
# Test-only fault injection (WARDEN_TEST_FAIL_AUDIT_APPEND) and the scripted
# planner (`provider = "mock"` in the agent config). Off by default; never
# enable it in a build that is shipped.
test-hooks = ["warden-agent/test-hooks"]

[[test]]
name = "test_hooks"
required-features = ["test-hooks"]

[[test]]
name = "agent"
required-features = ["test-hooks"]

[[test]]
name = "daemon"
required-features = ["test-hooks"]

[dependencies]
warden-core = { path = "../warden-core" }
warden-agent = { path = "../warden-agent" }
# Runtime for `warden agent` and `warden daemon` only (built inside those
# subcommands); `signal` for the daemon's SIGINT/SIGTERM shutdown.
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "signal", "sync"] }
clap = { version = "4", features = ["derive"] }
# Constants only (O_NOFOLLOW); no unsafe calls.
libc = "0.2"
rand = "0.8"
hex = "0.4"

[dev-dependencies]
# Self-reference so `cargo test` builds the binary with `test-hooks` on and
# the `test_hooks` target runs without extra flags.
warden-cli = { path = ".", features = ["test-hooks"] }
assert_cmd = "2"
tempfile = "3"
serde_json = "1"
regex = "1"
# Loopback fake Telegram Bot API for the `daemon` tests.
wiremock = "0.6"
tokio = { version = "1", features = ["macros"] }
# Signing fake WhatsApp webhooks (`X-Hub-Signature-256`) in the `daemon` tests.
hmac = "0.12"
sha2 = "0.10"
