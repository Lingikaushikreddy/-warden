[package]
name = "warden-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The warden command line: classify, run, undo, audit verify, prune, agent"

[[bin]]
name = "warden"
path = "src/main.rs"

[features]
# Test-only fault injection (WARDEN_TEST_FAIL_AUDIT_APPEND) and the scripted
# planner (`provider = "mock"` in the agent config). Off by default; never
# enable it in a build that is shipped.
test-hooks = ["warden-agent/test-hooks"]

[[test]]
name = "test_hooks"
required-features = ["test-hooks"]

[[test]]
name = "agent"
required-features = ["test-hooks"]

[dependencies]
warden-core = { path = "../warden-core" }
warden-agent = { path = "../warden-agent" }
# Runtime for `warden agent` only (built inside that subcommand).
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util"] }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
hex = "0.4"

[dev-dependencies]
# Self-reference so `cargo test` builds the binary with `test-hooks` on and
# the `test_hooks` target runs without extra flags.
warden-cli = { path = ".", features = ["test-hooks"] }
assert_cmd = "2"
tempfile = "3"
serde_json = "1"
regex = "1"
