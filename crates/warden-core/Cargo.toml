[package]
name = "warden-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Safety core for the Warden agent: action tiers, signed approvals, audit log, snapshots"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
thiserror = "1"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
